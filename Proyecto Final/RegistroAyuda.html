<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ayuda - Círculo de Apoyo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/brite/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Arial', sans-serif; background: #f8f9fa; color: #212529; }
        .help-card { max-width: 700px; margin: 40px auto; background: #fff; border: 4px solid #000; border-radius: 14px; box-shadow: 8px 8px 0 #000; padding: 28px; }
        .help-title { font-size: 2.5rem; font-weight: 900; color: #2a3d7a; text-align: center; margin-bottom: 20px; }
        .help-subtitle { font-size: 1.25rem; color: #333; text-align: center; margin-bottom: 30px; }
        label { font-size: 1.2rem; font-weight: 700; }
        .form-control, .form-select, .form-check-label { font-size: 1.2rem; }
        .btn-simple { background: #35d7e5; color: #000; border: 3px solid #000; border-radius: 12px; padding: 12px 24px; font-size: 1.25rem; font-weight: 700; box-shadow: 5px 5px 0 #000; }
        .btn-simple:hover { filter: brightness(1.05); }
        .alert-box { display: none; margin-top: 20px; }
        @media (max-width: 768px) { .help-card { margin: 20px 10px; padding: 20px; } .help-title { font-size: 2rem; } }
    </style>
</head>
<body>
    <div class="help-card">
        <h1 class="help-title">Registro de Ayuda</h1>
        <p class="help-subtitle">Interfaz simplificada para adultos mayores. Complete los datos y envie su solicitud.</p>

        <form id="helpForm" aria-label="Formulario registro de ayuda" novalidate>
            <div class="mb-3">
                <label for="fullName" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="fullName" name="fullName" aria-required="true" required placeholder="Ej. María Pérez" autocomplete="name">
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Teléfono / Celular</label>
                <input type="tel" class="form-control" id="phone" name="phone" aria-required="true" required placeholder="Ej. 987654321" pattern="[0-9]{7,15}">
                <div class="form-text">Sólo números, 7 a 15 dígitos.</div>
            </div>

            <div class="mb-3">
                <label for="serviceType" class="form-label">Tipo de ayuda</label>
                <select class="form-select" id="serviceType" name="serviceType" required aria-required="true">
                    <option value="" selected>Seleccione una opción</option>
                    <option value="hogar">Apoyo en el hogar</option>
                    <option value="medico">Cita médica / salud</option>
                    <option value="transporte">Transporte</option>
                    <option value="companias">Compañía y acompañamiento</option>
                    <option value="administrativo">Trámites administrativos</option>
                    <option value="tecnico">Soporte tecnológico</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Descripción de la solicitud</label>
                <textarea class="form-control" id="description" name="description" rows="4" required aria-required="true" placeholder="Describe brevemente qué necesitas"></textarea>
            </div>

            <div class="row mb-3">
                <div class="col-md-6 mb-3 mb-md-0">
                    <label for="date" class="form-label">Fecha preferida</label>
                    <input type="date" class="form-control" id="date" name="date" required aria-required="true" min="2026-04-01">
                </div>
                <div class="col-md-6">
                    <label for="time" class="form-label">Hora preferida</label>
                    <input type="time" class="form-control" id="time" name="time" required aria-required="true">
                </div>
            </div>

            <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" id="urgent" name="urgent" aria-label="Solicitud urgente">
                <label class="form-check-label" for="urgent">Marca si es una solicitud urgente</label>
            </div>

            <div class="d-flex justify-content-between">
                <button type="button" onclick="window.location.href='pagina inicio.html'" class="btn btn-secondary btn-simple">← Volver</button>
                <button type="submit" class="btn btn-success btn-simple">Enviar solicitud</button>
            </div>

            <div id="message" class="alert alert-success alert-box" role="alert"></div>
        </form>
    </div>

    <script>
        document.getElementById('helpForm').addEventListener('submit', function (event) {
            event.preventDefault();
            var form = event.target;
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            var data = {
                nombre: document.getElementById('fullName').value.trim(),
                telefono: document.getElementById('phone').value.trim(),
                tipo: document.getElementById('serviceType').value,
                descripcion: document.getElementById('description').value.trim(),
                fecha: document.getElementById('date').value,
                hora: document.getElementById('time').value,
                urgente: document.getElementById('urgent').checked
            };

            document.getElementById('message').style.display = 'block';
            document.getElementById('message').innerHTML = '<strong>Solicitud registrada con éxito.</strong> Hemos recibido tu petición de ayuda. Un equipo se comunicará contigo pronto.';

            form.reset();
            form.classList.remove('was-validated');

            console.log('Solicitud de ayuda enviada:', data);
        });
    </script>
</body>
</html>
