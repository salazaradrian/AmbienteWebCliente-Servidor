<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Círculo de Apoyo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/brite/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
            margin: 0;
        }

        .login-section {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 30px 15px;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            animation: float 6s ease-in-out infinite;
        }

        .circle-1 {
            width: 150px;
            height: 150px;
            top: 8%;
            left: 8%;
            animation-delay: 0s;
        }

        .circle-2 {
            width: 110px;
            height: 110px;
            bottom: 10%;
            right: 10%;
            animation-delay: 1s;
        }

        .circle-3 {
            width: 200px;
            height: 200px;
            top: 20%;
            right: 8%;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 550px;
        }

        .login-title {
            text-align: center;
            color: white;
            font-size: 3rem;
            font-weight: 900;
            text-shadow: 5px 5px 0 rgba(0, 0, 0, 0.25);
            margin-bottom: 15px;
            animation: fadeInDown 1s ease;
        }

        .login-subtitle {
            text-align: center;
            color: white;
            font-size: 1.15rem;
            font-weight: 600;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.18);
            margin-bottom: 30px;
            animation: fadeInUp 1s ease;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.97);
            border: 3px solid #000;
            border-radius: 14px;
            box-shadow: 8px 8px 0 #000;
            padding: 35px 30px;
        }

        .login-card h3 {
            text-align: center;
            color: #18bfe6;
            font-weight: 800;
            margin-bottom: 25px;
        }

        label {
            font-weight: 700;
            color: #18bfe6;
            margin-bottom: 8px;
            display: block;
        }

        .form-control {
            border: 2px solid #000;
            box-shadow: 4px 4px 0 #000;
            border-radius: 8px;
            min-height: 48px;
            transition: transform .08s ease, box-shadow .08s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #000;
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }

        .mb-3 {
            margin-bottom: 20px;
        }

        .btn-cartoon {
            background: #35d7e5;
            border: 2px solid #000;
            color: #000;
            font-weight: 700;
            padding: 10px 18px;
            border-radius: 10px;
            box-shadow: 6px 6px 0 #000;
            transition: transform .08s ease, box-shadow .08s ease;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 17px;
        }

        .btn-cartoon:hover {
            filter: brightness(1.06);
            color: #000;
        }

        .btn-cartoon:active {
            transform: translate(6px, 6px);
            box-shadow: 0 0 0 #000;
        }

        .btn-cartoon-secondary {
            background: #ff6b9c;
            border: 2px solid #000;
            color: #000;
            font-weight: 700;
            padding: 10px 18px;
            border-radius: 10px;
            box-shadow: 6px 6px 0 #000;
            transition: transform .08s ease, box-shadow .08s ease;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 17px;
        }

        .btn-cartoon-secondary:hover {
            filter: brightness(1.06);
            color: #000;
        }

        .btn-cartoon-secondary:active {
            transform: translate(6px, 6px);
            box-shadow: 0 0 0 #000;
        }

        .btn-cartoon-success {
            background: #4caf50;
            border: 2px solid #000;
            color: #000;
            font-weight: 700;
            padding: 10px 18px;
            border-radius: 10px;
            box-shadow: 6px 6px 0 #000;
            transition: transform .08s ease, box-shadow .08s ease;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 17px;
        }

        .btn-cartoon-success:hover {
            filter: brightness(1.06);
            color: #000;
        }

        .btn-cartoon-success:active {
            transform: translate(6px, 6px);
            box-shadow: 0 0 0 #000;
        }

        .btn-full {
            width: 100%;
            margin-bottom: 14px;
        }

        .extra-buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }

        .alert-custom {
            margin-top: 18px;
            padding: 12px 15px;
            border: 2px solid #000;
            border-radius: 8px;
            box-shadow: 4px 4px 0 #000;
            font-weight: 700;
        }

        .alert-success-custom {
            background: #4caf50;
            color: #000;
        }

        .alert-danger-custom {
            background: #ff8a8a;
            color: #000;
        }

        @media (max-width: 576px) {
            .login-title {
                font-size: 2.2rem;
            }

            .login-subtitle {
                font-size: 1rem;
            }

            .login-card {
                padding: 25px 20px;
            }

            .extra-buttons {
                flex-direction: column;
            }

            .extra-buttons a,
            .extra-buttons button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<section class="login-section">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>

    <div class="login-content">
        <h1 class="login-title">Círculo de Apoyo</h1>
        <p class="login-subtitle">Accede a tu cuenta para continuar en la plataforma</p>

        <div class="login-card">
            <h3>Iniciar Sesión</h3>

            <form method="POST" action="login.php">
                <div class="mb-3">
                    <label for="usuario">Usuario o Email</label>
                    <input type="text" id="usuario" name="usuario" class="form-control" placeholder="Ingresa tu usuario o correo" required>
                </div>

                <div class="mb-3">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="btn-cartoon-secondary btn-full">Ingresar</button>
            </form>

            <div class="extra-buttons">
                <a href="pagina inicio.html" class="btn-cartoon">Volver</a>
                <a href="RegistroUser.html" class="btn-cartoon-success">Registrar usuario</a>
            </div>
        </div>
    </div>
</section>

</body>
</html>
