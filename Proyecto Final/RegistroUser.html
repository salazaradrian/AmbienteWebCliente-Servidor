<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Círculo de Apoyo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/brite/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
            margin: 0;
        }

        .register-section {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 30px 15px;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            animation: float 6s ease-in-out infinite;
        }

        .circle-1 {
            width: 150px;
            height: 150px;
            top: 8%;
            left: 8%;
            animation-delay: 0s;
        }

        .circle-2 {
            width: 110px;
            height: 110px;
            bottom: 10%;
            right: 10%;
            animation-delay: 1s;
        }

        .circle-3 {
            width: 200px;
            height: 200px;
            top: 20%;
            right: 8%;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .register-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 1s ease-out;
        }

        .register-title {
            text-align: center;
            color: white;
            font-size: 3rem;
            font-weight: 900;
            text-shadow: 5px 5px 0 rgba(0, 0, 0, 0.25);
            margin-bottom: 15px;
        }

        .register-subtitle {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .register-form {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
        }

        .form-title {
            text-align: center;
            color: #667eea;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            color: #333;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .form-control {
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .btn-cartoon {
            background: #667eea;
            border: 2px solid #000;
            color: white;
            font-weight: 700;
            padding: 0.8rem 2rem;
            border-radius: 12px;
            box-shadow: 5px 5px 0 #000;
            transition: all .08s ease;
            cursor: pointer;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 1rem;
        }

        .btn-cartoon:hover {
            background: #5a67d8;
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0 #000;
        }

        .btn-cartoon:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 #000;
        }

        .btn-secondary-cartoon {
            background: #764ba2;
            border: 2px solid #000;
            color: white;
            font-weight: 700;
            padding: 0.6rem 1.5rem;
            border-radius: 12px;
            box-shadow: 4px 4px 0 #000;
            transition: all .08s ease;
            cursor: pointer;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
            margin-top: 1rem;
        }

        .btn-secondary-cartoon:hover {
            background: #6b46c1;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
        }

        .btn-secondary-cartoon:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: 600;
            color: #555;
        }

        .error-message {
            display: none;
            background: #fee;
            border: 2px solid #f44336;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            color: #c62828;
            font-weight: 600;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle input {
            padding-right: 3rem;
        }

        .password-toggle .toggle-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .register-title {
                font-size: 2.2rem;
            }

            .register-subtitle {
                font-size: 1rem;
            }

            .register-form {
                padding: 2rem 1.5rem;
            }

            .form-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>

    <section class="register-section">
        <!-- Círculos animados -->
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>

        <div class="register-content">
            <h1 class="register-title">Únete a Nuestro Círculo</h1>
            <p class="register-subtitle">Regístrate y forma parte de nuestra comunidad de apoyo</p>

            <div class="register-form">
                <h2 class="form-title">Crear Cuenta</h2>

                <form id="register-form" method="POST" action="registro.php" onsubmit="return validarFormulario()">
                    <div class="form-group">
                        <label class="form-label" for="tipo_usuario">Tipo de cuenta:</label>
                        <select id="tipo_usuario" name="tipo_usuario" class="form-control" required>
                            <option value="usuario">Adulto mayor (Abuelo)</option>
                            <option value="voluntario">Voluntario</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="usuario">Nombre Completo:</label>
                        <input type="text" id="usuario" name="nombre" class="form-control" required placeholder="Ingresa tu nombre completo">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" class="form-control" required placeholder="tu@email.com">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="Número de teléfono (opcional)">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Contraseña:</label>
                        <div class="password-toggle">
                            <input type="password" id="password" name="password" class="form-control" required placeholder="Mínimo 4 caracteres">
                            <button type="button" class="toggle-btn" onclick="togglePassword('password')">Mostrar</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirmar Contraseña:</label>
                        <div class="password-toggle">
                            <input type="password" id="confirmPassword" class="form-control" required placeholder="Repite tu contraseña">
                            <button type="button" class="toggle-btn" onclick="togglePassword('confirmPassword')">Mostrar</button>
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">Acepto los términos y condiciones</label>
                    </div>

                    <button type="submit" class="btn-cartoon">Crear Mi Cuenta</button>
                    <a href="pagina inicio.html" class="btn-secondary-cartoon">← Volver al Inicio</a>

                    <div id="error-message" class="error-message">
                        <span></span>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <script>
        function validarFormulario() {
            const usuario = document.getElementById("usuario").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const terms = document.getElementById("terms").checked;

            const errorMsg = document.getElementById("error-message");

            errorMsg.style.display = "none";

            if (!usuario || !email || !password || !confirmPassword) {
                errorMsg.innerHTML = "<span>Por favor completa todos los campos obligatorios</span>";
                errorMsg.style.display = "block";
                return false;
            }

            if (usuario.length < 3) {
                errorMsg.innerHTML = "<span>El nombre debe tener al menos 3 caracteres</span>";
                errorMsg.style.display = "block";
                return false;
            }

            if (password.length < 4) {
                errorMsg.innerHTML = "<span>La contraseña debe tener al menos 4 caracteres</span>";
                errorMsg.style.display = "block";
                return false;
            }

            if (password !== confirmPassword) {
                errorMsg.innerHTML = "<span>Las contraseñas no coinciden</span>";
                errorMsg.style.display = "block";
                return false;
            }

            if (!terms) {
                errorMsg.innerHTML = "<span>Debes aceptar los términos y condiciones</span>";
                errorMsg.style.display = "block";
                return false;
            }

            // Validación de email básica
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorMsg.innerHTML = "<span>Ingresa un correo electrónico válido</span>";
                errorMsg.style.display = "block";
                return false;
            }

            return true;
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const button = input.nextElementSibling;

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "Ocultar";
            } else {
                input.type = "password";
                button.textContent = "Mostrar";
            }
        }

        // Animación de entrada
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('.register-form');
            form.style.opacity = '0';
            form.style.transform = 'translateY(30px)';

            setTimeout(() => {
                form.style.transition = 'all 0.8s ease';
                form.style.opacity = '1';
                form.style.transform = 'translateY(0)';
            }, 300);
        });
    </script>

</body>
</html>
