<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List · PHP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    
    <style>
       
        :root {
            --bg:        #0f0f0f;
            --surface:   #1a1a1a;
            --border:    #2a2a2a;
            --accent:    #c8f135;
            --accent-dim:#8fb020;
            --text:      #e8e8e8;
            --muted:     #666;
            --danger:    #ff5252;
            --radius:    10px;
            --font-head: 'Syne', sans-serif;
            --font-mono: 'DM Mono', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 80px;
        }

       
        header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeDown .5s ease both;
        }

        header .tag {
            display: inline-block;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 4px 12px;
            border-radius: 4px;
            margin-bottom: 18px;
        }

        header h1 {
            font-family: var(--font-head);
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -1px;
            color: #fff;
        }

        header h1 span { color: var(--accent); }

       
        .card {
            width: 100%;
            max-width: 640px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            animation: fadeUp .5s ease .1s both;
        }

        
        .form-area {
            display: flex;
            gap: 10px;
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

       
        #nueva-tarea {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color .2s;
        }

        #nueva-tarea::placeholder { color: var(--muted); }

        #nueva-tarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(200, 241, 53, 0.08);
        }

       
        #btn-agregar {
            background: var(--accent);
            color: #0f0f0f;
            border: none;
            border-radius: var(--radius);
            padding: 12px 20px;
            font-family: var(--font-head);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, transform .1s;
            white-space: nowrap;
        }

        #btn-agregar:hover  { background: #d6ff30; }
        #btn-agregar:active { transform: scale(.97); }
        #btn-agregar:disabled { opacity: .5; cursor: not-allowed; }

       
        .list-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px 4px;
        }

        .list-meta span {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
        }

        #contador {
            font-family: var(--font-head);
            font-size: 12px;
            font-weight: 600;
            background: var(--border);
            color: var(--accent);
            padding: 2px 10px;
            border-radius: 20px;
        }

       
        #lista-tareas {
            list-style: none;
            padding: 8px 0 4px;
            min-height: 80px;
        }

        
        #lista-tareas.vacia::after {
            content: 'Sin tareas. ¡Agrega una arriba!';
            display: block;
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-size: 13px;
        }

      
        .tarea-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            transition: background .15s;
            animation: slideIn .25s ease both;
        }

        .tarea-item:last-child { border-bottom: none; }
        .tarea-item:hover { background: rgba(255,255,255,.02); }

      
        .tarea-icono {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        
        .tarea-nombre {
            flex: 1;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        
        .tarea-acciones { display: flex; gap: 6px; flex-shrink: 0; }

        
        .btn-completar {
            background: transparent;
            border: 1px solid var(--accent-dim);
            color: var(--accent);
            border-radius: 6px;
            padding: 5px 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            cursor: pointer;
            transition: background .2s, color .2s;
        }

        .btn-completar:hover { background: var(--accent); color: #0f0f0f; }

        
        .btn-eliminar {
            background: transparent;
            border: 1px solid #3a1a1a;
            color: var(--danger);
            border-radius: 6px;
            padding: 5px 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            cursor: pointer;
            transition: background .2s, color .2s;
        }

        .btn-eliminar:hover { background: var(--danger); color: #fff; }

       
        .tarea-item.completada .tarea-nombre {
            color: var(--muted);
            text-decoration: line-through;
        }

        
        .tarea-item.completada .tarea-icono {
            border-color: var(--accent);
            background: var(--accent);
            color: #0f0f0f;
        }

       
        .tarea-item.completada .btn-completar { display: none; }

       
        #mensaje-error {
            display: none;
            margin: 0 20px 10px;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 13px;
            background: rgba(255, 82, 82, .1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        #mensaje-error.visible { display: block; }

        
        #toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 10px 20px;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s, transform .25s;
            z-index: 100;
            white-space: nowrap;
        }

        #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.error   { border-color: var(--danger); color: var(--danger); }
        #toast.ok      { border-color: var(--accent); color: var(--accent); }

        /* ─── Animaciones ────────────────────────────────────────── */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    

    <header>
        <div class="tag">Práctica 3 · PHP Sessions</div>
        <h1>My <span>Tasks</span></h1>
    </header>

    <div class="card">

        
        <div class="form-area">
            <input
                type="text"
                id="nueva-tarea"
                placeholder="Nueva tarea…"
                maxlength="200"
                autocomplete="off"
            >
            <button type="button" id="btn-agregar">+ Agregar</button>
        </div>

        
        <div id="mensaje-error"></div>

        
        <div class="list-meta">
            <span>Tareas</span>
            <span id="contador">0</span>
        </div>

        
        <ul id="lista-tareas" class="vacia"></ul>

    </div>

   
    <div id="toast"></div>

  

</body>
</html>
